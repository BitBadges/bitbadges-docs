apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bitbadges-docs-ingress
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    # docs.bitbadges.io is proxied (orange cloud) in Cloudflare, so traffic
    # straight to the origin IP would bypass the WAF. Same list as the frontend
    # ingress; update when Cloudflare changes https://www.cloudflare.com/ips/.
    nginx.ingress.kubernetes.io/whitelist-source-range: "173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
spec:
  tls:
    - hosts:
        - docs.bitbadges.io
      # Reuses the same secret as bitbadges.io / testnet / stagenet. VERIFY it
      # actually covers this host before applying:
      #   kubectl get secret bitbadges-cert -o jsonpath='{.data.tls\.crt}' \
      #     | base64 -d | openssl x509 -noout -text | grep -A1 'Subject Alternative Name'
      # If it is not a *.bitbadges.io wildcard, add a cert-manager Certificate
      # for docs.bitbadges.io instead of pointing at this secret.
      secretName: bitbadges-cert
  rules:
    - host: docs.bitbadges.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bitbadges-docs
                port:
                  number: 80
  ingressClassName: nginx
