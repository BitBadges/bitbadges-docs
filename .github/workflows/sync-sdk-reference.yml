name: Sync SDK reference

# Regenerates the committed TypeDoc markdown under sdk/reference/ from
# BitBadges/bitbadgesjs. site/scripts/gen-sdk-reference.ts (script `gen:sdk`)
# does the work; BITBADGESJS_DIR points it at the checkout.
#
# Triggers:
#   - repository_dispatch `sdk-updated` — fired by bitbadgesjs on pushes that
#     touch packages/bitbadgesjs-sdk/src.
#   - workflow_dispatch — manual re-sync.
#   - schedule — weekly safety net.
#
# Never commits to master; opens a PR and no-ops on no diff.
# See _docs/runbooks/docs-sync.md.

on:
  repository_dispatch:
    types: [sdk-updated]
  workflow_dispatch:
  schedule:
    - cron: '31 6 * * 1'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-sdk-reference
  cancel-in-progress: false

env:
  # Tree the generator owns. The shrink guard measures exactly this path.
  TARGET_DIR: sdk/reference
  # Refuse a generation that deletes more than this share of the tree.
  MAX_SHRINK_PCT: '30'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs
        uses: actions/checkout@v7

      - name: Checkout bitbadgesjs
        uses: actions/checkout@v7
        with:
          repository: BitBadges/bitbadgesjs
          token: ${{ secrets.BITBADGESJS_READ_TOKEN || secrets.GITHUB_TOKEN }}
          ref: main
          path: .bitbadgesjs

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Preflight — generator and source tree must exist
        run: |
          set -euo pipefail
          fail=0

          if [ ! -f site/package.json ]; then
            echo "::error::site/package.json is missing — cannot run the SDK reference generator."
            exit 1
          fi

          if ! bun -e '
            const pkg = JSON.parse(require("fs").readFileSync("site/package.json", "utf8"));
            if (!pkg.scripts || !pkg.scripts["gen:sdk"]) {
              console.error("FAIL: site/package.json has no \"gen:sdk\" script.");
              console.error("Expected it to invoke site/scripts/gen-sdk-reference.ts. Add the script or fix this workflow.");
              process.exit(1);
            }
            console.log(`gen:sdk -> ${pkg.scripts["gen:sdk"]}`);
          '; then
            fail=1
          fi

          if [ ! -f site/scripts/gen-sdk-reference.ts ]; then
            echo "::error::site/scripts/gen-sdk-reference.ts is missing."
            fail=1
          fi

          if [ ! -d "$GITHUB_WORKSPACE/.bitbadgesjs/packages/bitbadgesjs-sdk" ]; then
            echo "::error::BITBADGESJS_DIR target .bitbadgesjs/packages/bitbadgesjs-sdk does not exist."
            echo "::error::The bitbadgesjs checkout failed or the SDK moved inside that repo."
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::Preflight failed — refusing to run the generator against a broken environment."
            exit 1
          fi

      - name: Record baseline size of the reference tree
        id: baseline
        run: |
          set -euo pipefail
          if [ -d "$TARGET_DIR" ]; then
            files=$(find "$TARGET_DIR" -type f | wc -l | tr -d ' ')
            bytes=$(find "$TARGET_DIR" -type f -exec cat {} + 2>/dev/null | wc -c | tr -d ' ')
          else
            files=0
            bytes=0
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
          echo "Baseline: $files file(s), $bytes byte(s) under $TARGET_DIR"

      - name: Install site deps
        working-directory: site
        run: bun install --frozen-lockfile

      # TypeDoc resolves the SDK's own imports, so the checkout needs its
      # dependencies. Without them it still emits, but with unresolved types
      # that quietly degrade the generated pages.
      - name: Install SDK deps
        working-directory: .bitbadgesjs/packages/bitbadgesjs-sdk
        run: bun install --frozen-lockfile || bun install

      - name: Generate SDK reference
        working-directory: site
        env:
          BITBADGESJS_DIR: ${{ github.workspace }}/.bitbadgesjs
        run: bun run gen:sdk

      - name: Shrink guard
        run: |
          set -euo pipefail
          before_files=${{ steps.baseline.outputs.files }}
          before_bytes=${{ steps.baseline.outputs.bytes }}

          if [ ! -d "$TARGET_DIR" ]; then
            echo "::error::$TARGET_DIR does not exist after generation — the generator produced nothing."
            exit 1
          fi

          after_files=$(find "$TARGET_DIR" -type f | wc -l | tr -d ' ')
          after_bytes=$(find "$TARGET_DIR" -type f -exec cat {} + 2>/dev/null | wc -c | tr -d ' ')
          echo "Before: $before_files file(s) / $before_bytes byte(s)"
          echo "After:  $after_files file(s) / $after_bytes byte(s)"

          if [ "$after_files" -eq 0 ]; then
            echo "::error::Generation produced zero files under $TARGET_DIR."
            exit 1
          fi

          if [ "$before_files" -eq 0 ]; then
            echo "No baseline (first generation) — shrink guard skipped."
            exit 0
          fi

          # Integer math: fail when after < before * (100 - MAX_SHRINK_PCT) / 100.
          keep=$((100 - MAX_SHRINK_PCT))
          if [ $((after_files * 100)) -lt $((before_files * keep)) ]; then
            echo "::error::File count fell from $before_files to $after_files (>${MAX_SHRINK_PCT}% shrink)."
            echo "::error::A broken generation must not silently delete the SDK reference. Investigate before merging."
            exit 1
          fi
          if [ $((after_bytes * 100)) -lt $((before_bytes * keep)) ]; then
            echo "::error::Total size fell from $before_bytes to $after_bytes bytes (>${MAX_SHRINK_PCT}% shrink)."
            echo "::error::A broken generation must not silently gut the SDK reference. Investigate before merging."
            exit 1
          fi
          echo "Shrink guard passed."

      - name: Drop upstream checkout before the PR is built
        run: rm -rf .bitbadgesjs

      # A regeneration that breaks the corpus must not open a green PR.
      - name: Verify the corpus still builds
        working-directory: site
        run: |
          bun run sync
          DOCS_REDIRECTS_STRICT=1 bun test
          bun run typecheck

      - name: Open PR
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.DOCS_SYNC_PAT || secrets.GITHUB_TOKEN }}
          base: master
          branch: sync/sdk-reference
          delete-branch: true
          add-paths: sdk/reference/**
          commit-message: 'chore(sdk): regenerate SDK reference from bitbadgesjs'
          title: 'chore(sdk): regenerate SDK reference from bitbadgesjs'
          body: |
            Automated regeneration of `sdk/reference/` via `bun run gen:sdk`
            against `BitBadges/bitbadgesjs@main`.

            Triggered by: `${{ github.event_name }}`.

            The shrink guard passed: the tree did not lose more than 30% of its
            files or bytes.

            Runbook: `_docs/runbooks/docs-sync.md`.
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>

      - name: Report
        run: |
          if [ -n "${{ steps.pr.outputs.pull-request-number }}" ]; then
            echo "PR #${{ steps.pr.outputs.pull-request-number }}: ${{ steps.pr.outputs.pull-request-url }}"
          else
            echo "SDK reference already up to date — nothing to do."
          fi
