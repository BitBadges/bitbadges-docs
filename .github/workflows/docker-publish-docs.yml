name: Docs site Docker image

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      # Content changes rebuild the site too: every page is prerendered.
      - '**/*.md'
      - '.gitbook/**'
      - 'site/**'
      - '.github/workflows/docker-publish-docs.yml'

jobs:
  build:
    # GitHub-hosted: unlike the frontend image, this build takes no secrets, so
    # it does not need the self-hosted runner (which is only online on demand).
    runs-on: ubuntu-latest
    environment: Docker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          # Context is the repo root; the site renders the markdown above it.
          context: .
          file: site/Dockerfile
          push: true
          tags: trevormil23/bitbadges-docs:latest
          platforms: linux/amd64
